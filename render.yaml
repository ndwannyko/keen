databases:
  - name: keenkings-db
    plan: free
    databaseName: keenkings_media
    user: keenkings

services:
  - type: web
    name: keenkings-media
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    initialDeployHook: php artisan db:seed --force
    envVars:
      - key: APP_NAME
        value: Keenkings Media
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Africa/Lusaka
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: keenkings-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: keenkings-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: keenkings-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: keenkings-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: keenkings-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MEDIA_DISK
        value: public
      - key: MAIL_MAILER
        value: log
      - key: CONTACT_EMAIL
        value: info@keenkingsmedia.com
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
